[package]
name = "raccpack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for raccpack: scan, secrets, pack, den"
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
walkdir = "2"
regex = "1"
blake3 = "1"
tar = "0.4"
zstd = "0.13"
age = "0.12"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[features]
age-decrypt = []

[dev-dependencies]
regex = "1"
serial_test = "3"
tempfile = "3"
tar = "0.4"
zstd = "0.13"
