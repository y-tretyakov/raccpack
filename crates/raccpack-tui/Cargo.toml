[package]
name = "raccpack-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI for raccpack"
rust-version.workspace = true

[[bin]]
name = "racc-tui"
path = "src/main.rs"

[dependencies]
raccpack-core = { path = "../raccpack-core" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
thiserror = "1"
humantime = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
