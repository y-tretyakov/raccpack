name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (e.g. v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MSRV: '1.85'

jobs:
  # --- Build matrix ---
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            arch: arm64
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: amd64
            cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p raccpack-cli --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.cross"
        run: cargo build -p raccpack-cli --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          BIN=racc
          TARGET=${{ matrix.target }}
          STAGING="staging-${TARGET}"
          mkdir -p "${STAGING}/raccpack-${VERSION}"
          cp "target/${TARGET}/release/${BIN}" "${STAGING}/raccpack-${VERSION}/"
          cat > "${STAGING}/raccpack-${VERSION}/README.txt" <<EOF
          raccpack ${VERSION} — ${TARGET}

          Install:
            tar xzf raccpack-${VERSION}-${TARGET}.tar.gz
            cd raccpack-${VERSION}
            sudo cp racc /usr/local/bin/

          Usage:
            racc --help
            racc --version

          Wiki: https://y-tretyakov.github.io/raccpack/
          EOF
          tar -czf "raccpack-${VERSION}-${TARGET}.tar.gz" -C "${STAGING}" "raccpack-${VERSION}"
          echo "TARBALL=raccpack-${VERSION}-${TARGET}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_PATH=raccpack-${VERSION}-${TARGET}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raccpack-${{ inputs.tag }}-${{ matrix.target }}
          path: raccpack-*.tar.gz
          retention-days: 1

  # --- Package deb/rpm ---
  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: raccpack-${{ inputs.tag }}-*
          merge-multiple: true

      - name: Build deb packages
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          for ARCH_DIR in artifacts/raccpack-${{ inputs.tag }}-*; do
            TARGET=$(basename "$ARCH_DIR" | sed "s/raccpack-${{ inputs.tag }}-//")
            case "$TARGET" in
              x86_64-unknown-linux-musl) DEB_ARCH=amd64 ;;
              aarch64-unknown-linux-musl) DEB_ARCH=arm64 ;;
              *) continue ;;
            esac
            BIN=$(find "$ARCH_DIR" -name "racc" -type f | head -1)
            if [ -z "$BIN" ]; then echo "No binary found in $ARCH_DIR"; continue; fi
            TMPDIR=$(mktemp -d)
            mkdir -p "${TMPDIR}/DEBIAN" "${TMPDIR}/usr/bin"
            cp "$BIN" "${TMPDIR}/usr/bin/racc"
            cat > "${TMPDIR}/DEBIAN/control" <<CTRL
          Package: raccpack
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: raccpack contributors
          Description: Secrets archiver and project packer
           Scans project directories for secrets, archives them with age encryption,
           cleans build artifacts, and packs projects into den storage.
          CTRL
            dpkg-deb --build "${TMPDIR}" "raccpack_${VERSION}_${DEB_ARCH}.deb"
            rm -rf "${TMPDIR}"
          done

      - name: Build rpm packages
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          sudo apt-get install -y -qq rpm 2>/dev/null
          for ARCH_DIR in artifacts/raccpack-${{ inputs.tag }}-*; do
            TARGET=$(basename "$ARCH_DIR" | sed "s/raccpack-${{ inputs.tag }}-//")
            case "$TARGET" in
              x86_64-unknown-linux-musl) RPM_ARCH=x86_64 ;;
              aarch64-unknown-linux-musl) RPM_ARCH=aarch64 ;;
              *) continue ;;
            esac
            BIN=$(find "$ARCH_DIR" -name "racc" -type f | head -1)
            if [ -z "$BIN" ]; then echo "No binary found in $ARCH_DIR"; continue; fi
            TMPDIR=$(mktemp -d)
            mkdir -p "${TMPDIR}/usr/bin"
            cp "$BIN" "${TMPDIR}/usr/bin/racc"
            cat > "/tmp/raccpack.spec" <<SPEC
          Name:           raccpack
          Version:        ${VERSION}
          Release:        1
          Summary:        Secrets archiver and project packer
          License:        MIT OR Apache-2.0
          BuildArch:      ${RPM_ARCH}

          %description
          Scans project directories for secrets, archives them with age encryption,
          cleans build artifacts, and packs projects into den storage.

          %install
          cp -a ${TMPDIR}/usr %{buildroot}/usr

          %files
          /usr/bin/racc
          SPEC
            rpmbuild -bb --define "_topdir /tmp/rpmbuild" --buildroot "${TMPDIR}" /tmp/raccpack.spec 2>/dev/null
            find /tmp/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \; 2>/dev/null
            rm -rf "${TMPDIR}" /tmp/rpmbuild
          done

      - name: SHA256SUMS
        run: |
          rm -f SHA256SUMS
          sha256sum raccpack-*.tar.gz raccpack_*.deb raccpack-*.rpm > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS

      - name: Upload all assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ inputs.tag }}
          path: |
            raccpack-*.tar.gz
            raccpack_*.deb
            raccpack-*.rpm
            SHA256SUMS
          retention-days: 1

  # --- Create GitHub Release ---
  release:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ inputs.tag }}
          path: dist/

      - name: Download banner
        run: cp detect-v2-banner.webp dist/ 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.tag }}"
          ASSETS=$(find dist/ -type f ! -name "*.part" | sort | while read f; do echo "-a $f"; done | tr '\n' ' ')

          cat > /tmp/release-notes.md <<'NOTES'
          ## raccpack ${{ inputs.tag }} — Detect v2

          ### Highlights
          - **Composite DAG detect** (`--detect-mode composite_dag` / `dag`), `stack_tree` in sniff
          - **DAG-scoped rinse** — cleanup scoped per ecosystem
          - **Batch raid** — `racc raid --root` (sequential, continue-on-error; `--only` / `--limit` / `--stop-on-error`)
          - Atomic raid preserved: staging + WAL + rollback; manifests in den
          - Alpha CLI feature set: sniff / dig / stash / rinse / pack / raid

          ### Breaking / migration
          CLI additive. Default detect mode remains `priority_table`. No breaking changes from 0.3.x.

          ### Artifacts
          - Linux musl tarballs: x86_64, aarch64
          - Debian packages: amd64, arm64
          - RPM packages: x86_64, aarch64
          - SHA256SUMS checksums
          - Banner: detect-v2-banner.webp

          ### Install
          ```bash
          # Linux (musl)
          tar xzf raccpack-${VERSION}-x86_64-unknown-linux-musl.tar.gz
          sudo cp raccpack-${VERSION}/racc /usr/local/bin/

          # Debian/Ubuntu
          sudo dpkg -i raccpack_${VERSION}_amd64.deb

          # Fedora/RHEL
          sudo rpm -i raccpack-${VERSION}-1.x86_64.rpm

          # From source
          cargo install raccpack-cli
          ```

          ### Links
          - [Wiki](https://y-tretyakov.github.io/raccpack/)
          - [Roadmap](https://y-tretyakov.github.io/raccpack/roadmap.html)
          - [CLI Usage](https://y-tretyakov.github.io/raccpack/cli-usage.html)
          NOTES

          sed -i "s/\${{ inputs.tag }}/${VERSION}/g" /tmp/release-notes.md

          gh release create "$VERSION" \
            --title "raccpack ${VERSION} — Detect v2" \
            --notes-file /tmp/release-notes.md \
            --latest \
            ${ASSETS}
